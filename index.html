<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kwentuhan · Coca-Cola family stories (prototype)</title>
<meta name="description" content="Working prototype: a weekly family question, unlocked by a glass Coke 2-pack. Lola answers by voice and the story is kept in your family's tapestry.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kwentuhan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">

<body>
<div class="stage">
  <aside class="aside" aria-label="About this prototype">
    <img class="logo-light" src="assets/img/coca-cola-script-red.png" alt="Coca-Cola" width="120" height="39">
    <img class="logo-dark" src="assets/img/coca-cola-script-white.png" alt="Coca-Cola" width="120" height="39">
    <h1>Kwentuhan</h1>
    <p>Working prototype. Open it on your phone to record and share for real.</p>
    <div class="qr" id="qr" aria-hidden="true"></div>
    <p class="fine" id="url"></p>
    <p class="fine">Student prototype for a BU111 live case at Wilfrid Laurier University. Not affiliated with, or endorsed by, The Coca-Cola Company.</p>
  </aside>
  <div class="device" id="device">
    <div class="app" id="app" aria-label="Coca-Cola app prototype">
      <div class="statusbar" aria-hidden="true"><span id="clock">9:41</span><span class="icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="4.6" y="5" width="3" height="6" rx=".8"/><rect x="9.2" y="2.6" width="3" height="8.4" rx=".8"/><rect x="13.8" y="0" width="3" height="11" rx=".8"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill="currentColor"/></svg></span></div>
      <div class="screen" id="screen"></div>
      <div class="layer" id="layer"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
<noscript><p style="padding:24px">This prototype needs JavaScript.</p></noscript>
<script src="lib/qrcode.js" defer></script>
<script src="app.js" defer></script>
